<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

            color-scheme: dark;

            color: #ececf5;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(34rem, calc(100% - 3rem));
            padding: 2rem;
            border: 1px solid rgb(139 92 246 / 35%);
            border-radius: 1rem;
            background: #181828;
            text-align: center;
        }

        img {
            width: 4rem;
            height: 4rem;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        a {
            padding: 0.75rem 1rem;
            border-radius: 0.7rem;
            background: #6a0dad;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

    <main>
        <img src="favicon.png" alt="Otaku Shelf">

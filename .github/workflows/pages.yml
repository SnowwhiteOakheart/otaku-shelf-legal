name: Rechtliche Seiten auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Statische Seiten vorbereiten
        run: |
          mkdir -p _site
          cp datenschutz.html impressum.html index.html favicon.png _site/
          cp robots.txt sitemap.xml _site/
          touch _site/.nojekyll

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Seiten veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
